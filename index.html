<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Select Menu Visit Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Raleway:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Raleway', sans-serif; background: linear-gradient(160deg, #2c1a2e 0%, #4a2040 30%, #7b3f6e 60%, #c9a96e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: linear-gradient(160deg, rgba(255,245,235,0.97) 0%, rgba(255,235,210,0.97) 100%); backdrop-filter: blur(12px); border-radius: 4px; box-shadow: 0 8px 48px rgba(90,30,60,0.35), inset 0 1px 0 rgba(212,175,55,0.4); padding: 2.5rem 2rem; max-width: 420px; width: 100%; text-align: center; border: 3px solid #c9a96e; outline: 1.5px solid rgba(212,175,55,0.3); outline-offset: 4px; position: relative; }
    .card::before, .card::after, .card-corner-bl, .card-corner-br { content: ''; position: absolute; width: 80px; height: 80px; pointer-events: none; }
    .mirror-corner { position: absolute; width: 120px; height: 120px; pointer-events: none; z-index: 10; background-image: url('resources/images/Baroque_Rococo_Edges.png'); background-size: contain; background-repeat: no-repeat; }
    .mirror-corner.tl { top: -12px; left: -12px; }
    .mirror-corner.tr { top: -12px; right: -12px; transform: scaleX(-1); }
    .mirror-corner.bl { bottom: -12px; left: -12px; transform: scaleY(-1); }
    .mirror-corner.br { bottom: -12px; right: -12px; transform: scale(-1,-1); }
    .page-title { font-family: 'Great Vibes', cursive; font-size: 42px; color: #8b1a4a; margin-bottom: 0.25rem; letter-spacing: 1px; text-shadow: 1px 2px 8px rgba(212,175,55,0.3); }
    .page-subtitle { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #c9a96e; margin-bottom: 1.5rem; font-weight: 600; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 1rem; color: #4a2040; letter-spacing: 0.5px; }
    .sub { font-size: 12px; color: #9e6b8a; margin-bottom: 1.25rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .btn { border: none; border-radius: 4px; padding: 0.75rem 1.5rem; font-size: 14px; font-weight: 600; cursor: pointer; margin: 0.4rem; min-width: 120px; transition: transform 0.15s, box-shadow 0.15s; font-family: 'Raleway', sans-serif; letter-spacing: 1.5px; text-transform: uppercase; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(90,30,60,0.25); }
    .btn-blue { background: linear-gradient(135deg, #8b1a4a, #4a2040); color: #f5e6d0; border: 1px solid rgba(212,175,55,0.3); }
    .btn-green { background: linear-gradient(135deg, #c9a96e, #a07840); color: #fff; border: 1px solid rgba(212,175,55,0.4); }
    .btn-red { background: linear-gradient(135deg, #6b1a3a, #4a1028); color: #f5e6d0; border: 1px solid rgba(212,175,55,0.3); }
    .btn-gray { background: linear-gradient(135deg, #c4a0b8, #9e6b8a); color: #fff; border: 1px solid rgba(212,175,55,0.2); }
    .btn-block { display: block; width: 100%; margin: 0.4rem 0; padding: 0.9rem; font-size: 14px; }
    .btn:disabled { background: #e8d5c4; color: #b09080; cursor: not-allowed; transform: none; box-shadow: none; }
    input[type="text"] { font-size: 18px; padding: 0.6rem 1rem; border-radius: 4px; border: 1px solid #c9a96e; width: 100%; margin-top: 0.5rem; text-align: center; font-family: 'Raleway', sans-serif; color: #4a2040; background: rgba(255,245,235,0.8); }
    input[type="text"]:focus { outline: none; border-color: #8b1a4a; background: #fff; box-shadow: 0 0 0 3px rgba(139,26,74,0.08); }
    .lbl { font-size: 11px; color: #9e6b8a; font-weight: 600; margin-bottom: 4px; display: block; text-align: left; letter-spacing: 1.5px; text-transform: uppercase; }
    .timer { font-size: 64px; font-weight: 700; color: #8b1a4a; letter-spacing: 2px; margin: 1rem 0; font-variant-numeric: tabular-nums; text-shadow: 1px 1px 12px rgba(212,175,55,0.3); }
    .progress-bar { width: 100%; height: 4px; background: #e8d5c4; border-radius: 2px; margin-bottom: 1.5rem; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #c9a96e, #8b1a4a); border-radius: 2px; transition: width 0.1s; }
    .divider { border: none; border-top: 1px solid rgba(212,175,55,0.35); margin: 1rem 0; }
    .stat-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .stat-box { background: linear-gradient(135deg, rgba(255,245,235,0.9), rgba(240,220,195,0.9)); border-radius: 8px; padding: 0.75rem 1rem; flex: 1; min-width: 80px; border: 1px solid rgba(212,175,55,0.3); }
    .stat-label { font-size: 10px; color: #9e6b8a; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .stat-val { font-size: 20px; font-weight: 700; color: #4a2040; margin-top: 2px; }
    .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 0.5rem; }
    .table-wrap { max-height: 200px; overflow-y: auto; border-radius: 8px; border: 1px solid rgba(212,175,55,0.3); margin-bottom: 1.25rem; text-align: left; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 6px 10px; text-align: left; font-weight: 700; color: #4a2040; border-bottom: 1px solid rgba(212,175,55,0.3); background: rgba(255,245,235,0.95); letter-spacing: 0.5px; }
    td { padding: 6px 10px; border-bottom: 1px solid rgba(240,220,195,0.8); color: #555; }
    tr:nth-child(even) td { background: rgba(255,245,235,0.5); }
    .avail-yes { color: #6b3a1f; font-weight: 700; }
    .avail-no { color: #9e6b8a; font-weight: 700; }
    .big-icon { font-size: 48px; margin-bottom: 8px; }
    .saved-time { font-family: 'Great Vibes', cursive; font-size: 42px; color: #8b1a4a; margin: 0.5rem 0; }
    .saved-time span { font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 600; color: #9e6b8a; display: block; margin-top: -8px; }
    .section-title { font-weight: 700; font-size: 11px; margin-bottom: 8px; text-align: left; color: #c9a96e; letter-spacing: 2px; text-transform: uppercase; }
    .unit-timer-bar { background: linear-gradient(135deg, rgba(255,245,235,0.9), rgba(240,220,195,0.9)); border-radius: 8px; padding: 0.6rem 1rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(212,175,55,0.3); }
    .unit-timer-label { font-size: 12px; font-weight: 600; color: #4a2040; letter-spacing: 0.5px; text-transform: uppercase; }
    .unit-timer-val { font-size: 15px; font-weight: 700; color: #8b1a4a; font-variant-numeric: tabular-nums; }
    .active-dot { display: inline-block; width: 7px; height: 7px; background: #c9a96e; border-radius: 50%; margin-right: 5px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .gold { color: #c9a96e; }
  </style>
</head>
<body>
<div style="position:relative;display:inline-block;max-width:420px;width:100%">
  <!-- Baroque SVG corner ornaments -->
  <div class="mirror-corner tl"></div>
  <div class="mirror-corner tr"></div>
  <div class="mirror-corner bl"></div>
  <div class="mirror-corner br"></div>
  <div class="card" id="app"></div>
</div>

<script>
  const UNITS = ["3 West", "2 East"];
  const records = [];
  let currentUnit = "", currentRoom = "", timerInterval = null, startTime = null, elapsed = 0;

  // Unit timers: track start time and accumulated ms for each unit
  const unitTimers = {
    "3 West": { startedAt: null, accumulated: 0, running: false },
    "2 East": { startedAt: null, accumulated: 0, running: false }
  };
  let unitTimerInterval = null;

  const today = () => new Date().toISOString().slice(0, 10);
  const getWindow = () => {
    const m = new Date().getHours() * 60 + new Date().getMinutes();
    if (m < 9 * 60 + 30) return "8:00 AM";
    if (m < 13 * 60) return "11:00 AM";
    return "2:30 PM";
  };
  const sessionWindow = getWindow();

  const fmt = ms => {
    const s = Math.floor(ms / 1000), m = Math.floor(s / 60);
    return `${String(m).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  };
  const fmtMin = ms => (ms / 60000).toFixed(2);

  // Start unit timer for given unit, pause others
  function startUnitTimer(unit) {
    const now = Date.now();
    UNITS.forEach(u => {
      const t = unitTimers[u];
      if (u === unit) {
        if (!t.running) { t.startedAt = now; t.running = true; }
      } else {
        if (t.running) { t.accumulated += now - t.startedAt; t.startedAt = null; t.running = false; }
      }
    });
    if (!unitTimerInterval) {
      unitTimerInterval = setInterval(updateUnitTimerDisplay, 500);
    }
  }

  function stopAllUnitTimers() {
    const now = Date.now();
    UNITS.forEach(u => {
      const t = unitTimers[u];
      if (t.running) { t.accumulated += now - t.startedAt; t.startedAt = null; t.running = false; }
    });
    clearInterval(unitTimerInterval);
    unitTimerInterval = null;
  }

  function getUnitElapsed(unit) {
    const t = unitTimers[unit];
    return t.accumulated + (t.running ? Date.now() - t.startedAt : 0);
  }

  function updateUnitTimerDisplay() {
    UNITS.forEach(u => {
      const el = document.getElementById(`unit-timer-${u.replace(" ","")}`);
      if (el) el.textContent = fmt(getUnitElapsed(u));
    });
  }

  const unitTimerBars = () => UNITS.map(u => {
    const elapsed = getUnitElapsed(u);
    const isRunning = unitTimers[u].running;
    return `<div class="unit-timer-bar">
      <span class="unit-timer-label">${isRunning ? '<span class="active-dot"></span>' : ''}${u}</span>
      <span class="unit-timer-val" id="unit-timer-${u.replace(" ","")}">${fmt(elapsed)}</span>
    </div>`;
  }).join("");

  const render = html => document.getElementById("app").innerHTML = `<div class="page-title">Visit Tracker</div><div class="page-subtitle">✦ Select Menu Collection ✦</div>` + html;

  const stats = () => {
    const seen = records.filter(r => r.available === "Yes");
    const times = seen.map(r => parseFloat(r.time_min)).filter(t => !isNaN(t));
    return {
      seen: seen.length,
      unseen: records.filter(r => r.available === "No").length,
      total: records.length,
      min: times.length ? Math.min(...times).toFixed(2) : "—",
      max: times.length ? Math.max(...times).toFixed(2) : "—",
      avg: times.length ? (times.reduce((a,b)=>a+b,0)/times.length).toFixed(2) : "—"
    };
  };

  const statBox = (lbl, val) =>
    `<div class="stat-box"><div class="stat-label">${lbl}</div><div class="stat-val">${val}</div></div>`;

  const tableRows = () => records.map((r) =>
    `<tr>
      <td>${r.unit}</td>
      <td>${r.room}</td>
      <td class="${r.available==="Yes"?"avail-yes":"avail-no"}">${r.available}</td>
      <td>${r.time_min || "—"}</td>
    </tr>`).join("");

  // ── SCREENS ──────────────────────────────────────────────

  function showUnit() {
    render(`
      <div class="sub">Session · ${sessionWindow} · ${today()}</div>
      <h1>Which unit are you visiting?</h1>
      ${UNITS.map(u => `<button class="btn btn-blue btn-block" onclick="selectUnit('${u}')">${u}</button>`).join("")}
      ${records.length > 0 ? `<button class="btn btn-green btn-block" onclick="showSummary()" style="margin-top:8px">View Session Summary (${records.length} records)</button>` : ""}
    `);
  }

  function selectUnit(u) {
    currentUnit = u;
    startUnitTimer(u);
    showRoom();
  }

  function showRoom() {
    render(`
      <div class="sub">${currentUnit} · ${sessionWindow}</div>
      <h1>What room are you visiting?</h1>
      <span class="lbl">Room Number</span>
      <input type="text" id="roomInput" placeholder="e.g. 301" onkeydown="if(event.key==='Enter')submitRoom()" autofocus />
      <button class="btn btn-blue btn-block" style="margin-top:1rem" onclick="submitRoom()">Next</button>
      <div class="btn-row" style="margin-top:0.75rem">
        <button class="btn btn-gray" onclick="showUnit()">Change Unit</button>
        ${records.length > 0 ? `<button class="btn btn-green" onclick="endSession()">End Session</button>` : ""}
      </div>
      <div style="margin-top:1rem">${unitTimerBars()}</div>
    `);
    document.getElementById("roomInput").focus();
  }

  function submitRoom() {
    const val = document.getElementById("roomInput").value.trim();
    if (!val) return;
    currentRoom = val;
    showAvailable();
  }

  function showAvailable() {
    render(`
      <div class="sub">${currentUnit} · Room ${currentRoom}</div>
      <h1>Is the patient available?</h1>
      <p style="color:#e91e8c;font-size:14px;margin-bottom:1.5rem">Tap <strong>Yes</strong> to start the stopwatch as you enter the room.</p>
      <div class="btn-row">
        <button class="btn btn-green" style="font-size:18px;min-width:140px;padding:1rem" onclick="startTimer()">✓ Yes</button>
        <button class="btn btn-red" style="font-size:18px;min-width:140px;padding:1rem" onclick="markUnavailable()">✗ No</button>
      </div>
      <button class="btn btn-gray" style="margin-top:1.5rem" onclick="showRoom()">← Back</button>
      <div style="margin-top:1rem">${unitTimerBars()}</div>
    `);
  }

  function startTimer() {
    startTime = Date.now();
    elapsed = 0;
    render(`
      <div class="sub">${currentUnit} · Room ${currentRoom}</div>
      <h1>Visit in progress</h1>
      <div class="timer" id="timerDisplay">00:00</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <button class="btn btn-red btn-block" style="padding:1rem;font-size:18px" onclick="stopTimer()">Stop &amp; Save</button>
      <div style="margin-top:1rem">${unitTimerBars()}</div>
    `);
    timerInterval = setInterval(() => {
      elapsed = Date.now() - startTime;
      const el = document.getElementById("timerDisplay");
      const pf = document.getElementById("progressFill");
      if (el) el.textContent = fmt(elapsed);
      if (pf) pf.style.width = Math.min((elapsed / 300000) * 100, 100) + "%";
      updateUnitTimerDisplay();
    }, 100);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    const duration = elapsed;
    records.push({ date: today(), unit: currentUnit, visit_window: sessionWindow, room: currentRoom, available: "Yes", time_display: fmt(duration), time_min: fmtMin(duration) });
    showSaved();
  }

  function markUnavailable() {
    records.push({ date: today(), unit: currentUnit, visit_window: sessionWindow, room: currentRoom, available: "No", time_display: "—", time_min: "" });
    showSaved();
  }

  function showSaved() {
    const last = records[records.length - 1];
    const isAvail = last.available === "Yes";
    render(`
      <div class="big-icon">${isAvail ? "✅" : "📋"}</div>
      <h1>${isAvail ? "Visit recorded!" : "Marked unavailable"}</h1>
      <div class="sub">Room ${last.room} · ${last.unit}</div>
      ${isAvail ? `<div class="saved-time">${last.time_display} <span>(${last.time_min} min)</span></div>` : ""}
      <div style="color:#9e6b8a;font-size:13px;margin-bottom:1rem">Total records this session: ${records.length}</div>
      <div style="text-align:left;margin-bottom:1rem">
        <span class="lbl">Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#b09080">(optional)</span></span>
        <input type="text" id="noteInput" placeholder="e.g. patient requested callback" />
      </div>
      <button class="btn btn-blue btn-block" onclick="saveNoteAndContinue()">Next Room →</button>
      <div class="btn-row">
        <button class="btn btn-gray" onclick="saveNoteAndChangeUnit()">Change Unit</button>
        <button class="btn btn-green" onclick="saveNoteAndEndSession()">End Session</button>
      </div>
      <div style="margin-top:1rem">${unitTimerBars()}</div>
    `);
  }

  function getNoteValue() {
    const el = document.getElementById("noteInput");
    return el ? el.value.trim() : "";
  }

  function saveNoteAndContinue() {
    records[records.length - 1].notes = getNoteValue();
    showRoom();
  }

  function saveNoteAndChangeUnit() {
    records[records.length - 1].notes = getNoteValue();
    showUnit();
  }

  function saveNoteAndEndSession() {
    records[records.length - 1].notes = getNoteValue();
    endSession();
  }

  function endSession() {
    stopAllUnitTimers();
    showSummary();
  }

  function showSummary() {
    const s = stats();
    const w3Time = getUnitElapsed("3 West");
    const e2Time = getUnitElapsed("2 East");
    render(`
      <h1>Session Summary</h1>
      <div class="sub">${today()} · ${sessionWindow}</div>

      <div class="section-title">🏥 Time Spent Per Unit</div>
      <div class="stat-row">
        ${statBox("3 West", fmt(w3Time))}
        ${statBox("2 East", fmt(e2Time))}
      </div>
      <div class="stat-row">
        ${statBox("3 West (min)", w3Time > 0 ? fmtMin(w3Time) : "—")}
        ${statBox("2 East (min)", e2Time > 0 ? fmtMin(e2Time) : "—")}
      </div>

      <div class="section-title" style="margin-top:0.5rem">👥 Patient Interactions</div>
      <div class="stat-row">
        ${statBox("Seen", s.seen)}
        ${statBox("Unavailable", s.unseen)}
        ${statBox("Total", s.total)}
      </div>
      <div class="stat-row">
        ${statBox("Min (min)", s.min)}
        ${statBox("Max (min)", s.max)}
        ${statBox("Avg (min)", s.avg)}
      </div>

      <div class="section-title" style="margin-top:0.5rem">All Records</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Unit</th><th>Room</th><th>Available</th><th>Time (min)</th></tr></thead>
          <tbody>${tableRows()}</tbody>
        </table>
      </div>
      <div class="btn-row" style="margin-bottom:1rem">
        <button class="btn btn-blue" onclick="downloadCSV()">⬇ Download CSV</button>
        <button class="btn btn-green" onclick="downloadXLSX()">⬇ Download Excel</button>
      </div>
      <button class="btn btn-gray btn-block" onclick="showRoom()">← Continue Collecting</button>
    `);
  }

  function buildPatientRows() {
    const w3 = parseFloat(fmtMin(getUnitElapsed("3 West"))) || 0;
    const e2 = parseFloat(fmtMin(getUnitElapsed("2 East"))) || 0;
    const combined = (w3 + e2).toFixed(2);
    return records.map(r => {
      const unitTime = r.unit === "3 West" ? w3.toFixed(2) : e2.toFixed(2);
      return [r.date, r.unit, r.visit_window, r.room, r.available, r.time_min, r.notes || "", unitTime, combined];
    });
  }

  function buildUnitLogRows() {
    // Group records by date + unit + visit_window
    const sessionMap = {};
    records.forEach(r => {
      const key = `${r.date}||${r.unit}||${r.visit_window}`;
      if (!sessionMap[key]) {
        sessionMap[key] = { date: r.date, unit: r.unit, visit_window: r.visit_window, attempted: 0, seen: 0, unavailable: 0 };
      }
      sessionMap[key].attempted++;
      if (r.available === "Yes") sessionMap[key].seen++;
      else sessionMap[key].unavailable++;
    });
    const w3 = parseFloat(fmtMin(getUnitElapsed("3 West"))) || 0;
    const e2 = parseFloat(fmtMin(getUnitElapsed("2 East"))) || 0;
    return Object.values(sessionMap).map(s => {
      const unitTime = s.unit === "3 West" ? w3.toFixed(2) : e2.toFixed(2);
      return [s.date, s.unit, s.visit_window, s.attempted, s.seen, s.unavailable, unitTime];
    });
  }

  function downloadCSV() {
    const headers = ["Date","Unit","Visit_Window","Room","Available","Interaction_Time_Min","Notes","Unit_Time_Min","Combined_Duration_Min"];
    const rows = buildPatientRows();
    const csv = [headers, ...rows].map(r => r.map(v => `"${v}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `Visit_Log_${today()}.csv`;
    a.click();
  }

  function downloadXLSX() {
    const wb = XLSX.utils.book_new();

    // Patient Log sheet
    const patientData = [
      ["Date","Unit","Visit_Window","Room","Available","Interaction_Time_Min","Notes","Unit_Time_Min","Combined_Duration_Min"],
      ...buildPatientRows()
    ];
    const patientWS = XLSX.utils.aoa_to_sheet(patientData);
    patientWS["!cols"] = [14,10,12,8,10,22,30,16,22].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, patientWS, "Patient Log");

    // Unit Log sheet
    const unitData = [
      ["Date","Unit","Visit_Window","Patients_Attempted","Patients_Seen","Patients_Unavailable","Session_Duration_Min"],
      ...buildUnitLogRows()
    ];
    const unitWS = XLSX.utils.aoa_to_sheet(unitData);
    unitWS["!cols"] = [14,10,14,20,16,22,22].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, unitWS, "Unit Log");

    XLSX.writeFile(wb, `Visit_Log_${today()}.xlsx`);
  }

  showUnit();
</script>
</body>
</html>
